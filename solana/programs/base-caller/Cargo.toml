[package]
name = "base-caller"
version = "0.1.0"
description = "Invoke Base contract functions from Solana"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "base_caller"

[features]
# The Wormhole SDK declares the core bridge program id under a cfg_if, so
# exactly one of its network features must be on or it will not compile. This
# program does NOT read that id -- the bridge address comes from
# TransportConfig at runtime, so one binary can talk to a mock on localnet --
# but the feature still has to be selected. Default to mainnet.
default = ["wormhole-mainnet"]
wormhole-mainnet = ["wormhole-anchor-sdk/mainnet"]
wormhole-devnet = ["wormhole-anchor-sdk/solana-devnet"]
wormhole-localnet = ["wormhole-anchor-sdk/tilt-devnet"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Official Wormhole CPI bindings. Replaces hand-encoding post_message: the
# instruction layout, account ordering and Finality encoding come from the
# bridge's own SDK rather than from this repo's reading of the docs.
# default-features off: the SDK's `mainnet` feature pins the core bridge
# program id at compile time, but this program takes it from TransportConfig
# so the same binary works against a mock on localnet.
wormhole-anchor-sdk = { version = "0.30.1-alpha.3", default-features = false }
